# Public example: configure credentials and gateway URLs in the environment.
# Change runs.agent to codex, claude, openclaw, or hermes.
tasksDir: ./tasks
outputDir: .build/agent-connectors
clusterCreationPolicy: DoNotCreate

agents:
  - id: codex
    bin: ./k8s-ai-agent-bridge
    adapter: generic-stdin
    args: [--agent, codex]

  - id: claude
    bin: ./k8s-ai-agent-bridge
    adapter: generic-stdin
    args: [--agent, claude]

  - id: openclaw
    bin: ./k8s-ai-agent-bridge
    adapter: generic-stdin
    args: [--agent, openclaw]
    env:
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_AGENT_TARGET: ${OPENCLAW_AGENT_TARGET}

  - id: hermes
    bin: ./k8s-ai-agent-bridge
    adapter: generic-stdin
    args: [--agent, hermes]
    env:
      HERMES_BASE_URL: ${HERMES_BASE_URL}
      HERMES_GATEWAY_TOKEN: ${HERMES_GATEWAY_TOKEN}
      HERMES_AGENT_TARGET: ${HERMES_AGENT_TARGET}

models:
  - id: agent-model
    provider: openai
    model: gpt-5.3-codex

runs:
  iterations: 1
  concurrency: 1
  taskPattern: "create-pod"
  agent: codex
