tasksDir: ./tasks/skill-cli-hermes
outputDir: .build/hermes-bench
clusterCreationPolicy: DoNotCreate

agents:
  - id: hermes
    bin: ./k8s-ai-agent-bridge
    adapter: generic-stdin
    args: [--agent, hermes]
    env:
      HERMES_BASE_URL: ${HERMES_BASE_URL}
      HERMES_GATEWAY_TOKEN: ${HERMES_GATEWAY_TOKEN}
      HERMES_AGENT_TARGET: ${HERMES_AGENT_TARGET}

models:
  - id: hermes-agent
    provider: openai
    model: hermes-agent

runs:
  iterations: 1
  concurrency: 1
  taskPattern: "kpanda-cluster-diagnosis"
