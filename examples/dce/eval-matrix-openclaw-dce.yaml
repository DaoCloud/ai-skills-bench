# Remote OpenClaw DCE skill evaluation.
# The DCE CLI, skill, cluster access, and DCE credentials must exist in the
# remote OpenClaw runtime; only the gateway connection is configured here.
skillsDir: ${DCE_SKILLS_DIR}
tasksDir: ./tasks/agent-connectors-remote
outputDir: .build/openclaw-dce
clusterCreationPolicy: DoNotCreate

agents:
  - id: openclaw
    bin: ./k8s-ai-agent-bridge
    adapter: generic-stdin
    args: [--agent, openclaw]
    env:
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_AGENT_TARGET: ${OPENCLAW_AGENT_TARGET}
      DCE_HOST: ${DCE_HOST}
      DCE_TOKEN: ${DCE_TOKEN}
      DCE_INSECURE_SKIP_VERIFY: ${DCE_INSECURE_SKIP_VERIFY}

models:
  - id: openclaw-dce
    provider: openai
    model: openclaw/default

runs:
  iterations: 1
  concurrency: 1
  taskPattern: "dce-create-pod-env"
  agent: openclaw
